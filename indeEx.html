<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Website is down</title>

    <meta
      name="description"
      content="This website is temporarily unavailable."
    />

    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #f8f1e7;
        background: #2f1f3b;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
      }

      .down-page {
        position: relative;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        padding: 2rem;
        background:
          linear-gradient(
            135deg,
            rgba(47, 31, 59, 0.98),
            rgba(64, 38, 73, 0.94)
          ),
          #2f1f3b;
      }

      .down-page::before,
      .down-page::after {
        position: absolute;
        border: 1px solid rgba(248, 241, 231, 0.11);
        border-radius: 50%;
        content: '';
        pointer-events: none;
      }

      .down-page::before {
        width: min(68vw, 52rem);
        height: min(68vw, 52rem);
        transform: translate(35%, -23%);
      }

      .down-page::after {
        width: min(32vw, 23rem);
        height: min(32vw, 23rem);
        transform: translate(-105%, 70%);
        border-color: rgba(244, 181, 75, 0.2);
      }

      .down-page__glow {
        position: absolute;
        width: 18rem;
        height: 18rem;
        border-radius: 50%;
        background: rgba(244, 181, 75, 0.16);
        filter: blur(80px);
        transform: translate(-90%, -70%);
      }

      .down-page__content {
        position: relative;
        z-index: 1;
        max-width: 48rem;
        text-align: center;
        animation: appear 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .down-page__dot {
        display: inline-block;
        width: 0.7rem;
        height: 0.7rem;
        margin-bottom: 1.4rem;
        border-radius: 50%;
        background: #f4b54b;
        box-shadow: 0 0 0 0.45rem rgba(244, 181, 75, 0.14);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .down-page__eyebrow {
        margin: 0 0 1.1rem;
        color: rgba(248, 241, 231, 0.62);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #f8f1e7;
        font-size: clamp(3.5rem, 10vw, 7.5rem);
        font-weight: 500;
        letter-spacing: -0.07em;
        line-height: 0.93;
      }

      .down-page__message {
        margin: 1.5rem 0 0;
        color: rgba(248, 241, 231, 0.7);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.6;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0.45rem rgba(244, 181, 75, 0.14);
        }

        50% {
          box-shadow: 0 0 0 0.7rem rgba(244, 181, 75, 0.04);
        }
      }

      @media (max-width: 640px) {
        .down-page {
          padding: 1.5rem;
        }

        h1 {
          font-size: clamp(3.1rem, 17vw, 5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .down-page__content,
        .down-page__dot {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="down-page">
      <div class="down-page__glow" aria-hidden="true"></div>

      <section
        class="down-page__content"
        aria-labelledby="website-down-title"
      >
        <span class="down-page__dot" aria-hidden="true"></span>

        <p class="down-page__eyebrow">Temporary outage</p>

        <h1 id="website-down-title">Website is down</h1>

        <p class="down-page__message">We’ll be back soon.</p>
      </section>
    </main>
  </body>
</html>
