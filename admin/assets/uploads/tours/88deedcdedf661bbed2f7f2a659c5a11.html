    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Exo 2', sans-serif; }
        #panorama { width: 100%; height: 100%; }
        .pnlm-tooltip a, .pnlm-tooltip a:visited { color: #ffffff; text-decoration: underline; }
        .pnlm-tooltip a:hover { color: #cccccc; }
        .nadir-cap-hotspot {
            width: 0 !important; height: 0 !important; padding: 0 !important; margin: 0 !important;
            pointer-events: none; cursor: default; border: none !important; background: none !important;
        }
        .nadir-cap-hotspot::after {
            content: ''; display: block; position: absolute; top: 0; left: 0;
            width: 120px; height: 120px;
            background-image: url(""); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            border-radius: 50%; transform: translate(-50%, -50%);
        }
        #tour-mute-btn {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%;
            width: 44px; height: 44px; font-size: 22px; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            transition: background 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #tour-mute-btn:hover { background: rgba(0,0,0,0.8); }
    </style>

        // --- Custom Audio Manager ---
        let globalAudio = null;
        let sceneAudio = null;
        let isMuted = false;
        let audioContextStarted = false;
        const muteBtn = document.getElementById('tour-mute-btn');
        
        function checkHasAudio() {
            if (tourConfig.globalAudio && tourConfig.globalAudio.url) return true;
            for (const key in tourConfig.scenes) {
                if (tourConfig.scenes[key].audio && tourConfig.scenes[key].audio.url) return true;
            }
            return false;
        }

        if (checkHasAudio()) {
            muteBtn.style.display = 'flex';
            
            if (tourConfig.globalAudio && tourConfig.globalAudio.url) {
                globalAudio = new Audio(tourConfig.globalAudio.url);
                globalAudio.loop = tourConfig.globalAudio.loop;
            }

            const initialSceneId = tourConfig.default.firstScene;
            if (initialSceneId && tourConfig.scenes[initialSceneId].audio && tourConfig.scenes[initialSceneId].audio.url) {
                sceneAudio = new Audio(tourConfig.scenes[initialSceneId].audio.url);
                sceneAudio.loop = tourConfig.scenes[initialSceneId].audio.loop;
            }

            // Browsers block autoplay until user interacts. 
            const startAudioContext = () => {
                if (audioContextStarted) return;
                audioContextStarted = true;
                if (!isMuted) {
                    if (globalAudio && globalAudio.paused) globalAudio.play().catch(e=>console.warn(e));
                    if (sceneAudio && sceneAudio.paused) sceneAudio.play().catch(e=>console.warn(e));
                }
            };
            
            document.body.addEventListener('click', startAudioContext, {once: true});
            document.body.addEventListener('touchstart', startAudioContext, {once: true});

            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // prevent triggering the body click event simultaneously
                isMuted = !isMuted;
                muteBtn.innerText = isMuted ? '🔇' : '🔊';
                if (globalAudio) globalAudio.muted = isMuted;
                if (sceneAudio) sceneAudio.muted = isMuted;
                
                if (!isMuted) {
                    audioContextStarted = true; // manual unmute counts as interaction
                    if (globalAudio && globalAudio.paused) globalAudio.play().catch(e=>console.warn(e));
                    if (sceneAudio && sceneAudio.paused) sceneAudio.play().catch(e=>console.warn(e));
                }
            });
            
            viewer.on('scenechange', function(sceneId) {
                if (sceneAudio) {
                    sceneAudio.pause();
                    sceneAudio = null;
                }
                const scene = tourConfig.scenes[sceneId];
                if (scene && scene.audio && scene.audio.url) {
                    sceneAudio = new Audio(scene.audio.url);
                    sceneAudio.loop = scene.audio.loop;
                    sceneAudio.muted = isMuted;
                    if (audioContextStarted && !isMuted) {
                        sceneAudio.play().catch(e=>console.warn(e));
                    }
                }
            });
        }
    </script>
</body>
</html>
